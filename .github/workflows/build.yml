name: Criar APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar NDK e plataforma Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;25.2.9519653" "platforms;android-33" "build-tools;33.0.2"

      - name: Compilar tun2socks (hev-socks5-tunnel)
        run: |
          NDK="$ANDROID_HOME/ndk/25.2.9519653"
          mkdir -p native/jni
          git clone --depth 1 --recursive https://github.com/heiher/hev-socks5-tunnel native/jni/hev-socks5-tunnel
          printf 'include $(call all-subdir-makefiles)\n' > native/jni/Android.mk
          "$NDK/ndk-build" NDK_PROJECT_PATH="$PWD/native" \
            APP_BUILD_SCRIPT="$PWD/native/jni/Android.mk" \
            "APP_ABI=armeabi-v7a arm64-v8a" APP_PLATFORM=android-26 \
            NDK_LIBS_OUT="$PWD/app/src/main/jniLibs"
          find app/src/main/jniLibs -name "*.so"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TunnelLite-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
